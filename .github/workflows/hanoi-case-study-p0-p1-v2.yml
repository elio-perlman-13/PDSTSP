name: Hanoi case study - P0 and P1

on:
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Maximum parallel optimization jobs"
        required: true
        default: "60"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HANOI_SOURCE_ROOT: instance_hanoi/datasets/hanoi_traffic/Hanoi_15x15_2026/profile_instances

jobs:
  prepare:
    name: Build solver, P0/P1 profiles, and matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate source data
        shell: bash
        run: |
          set -euo pipefail
          for dataset in set_01 set_02 set_03; do
            for profile in weekday thu7 chunhat; do
              stem="hanoi_15x15_100_${dataset}_${profile}"
              base="$HANOI_SOURCE_ROOT/$dataset/$profile/$stem"
              test -s "$base.txt"
              test -s "$base.truck_distance_m.txt"
              test -s "$base.drone_distance_m.txt"
              test -s "$base.v_ijl_kph.txt"
            done
          done

      - name: Build P0 and P1 traffic profiles
        run: |
          python3 scripts/hanoi_case_study_cloud.py build-profiles \
            --source-root "$HANOI_SOURCE_ROOT" \
            --output-root build/hanoi_case_policies

      - name: Build V2 Hanoi solver
        run: |
          mkdir -p build/hanoi_case_solver
          g++ -O3 -std=c++20 src_v2/tabubu_HanoiTraffic_v2.cpp \
            -o build/hanoi_case_solver/tabubu_HanoiTraffic_v2

      - name: Generate matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/hanoi_case_study_cloud.py matrix --experiment policy --group-size 1)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          python3 -c 'import json,sys; m=json.loads(sys.argv[1]); assert len(m["include"])==120; assert sum(x["task_count"] for x in m["include"])==120' "$matrix"

      - name: Smoke test optimization and replay
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          p0="$root/build/hanoi_case_policies/P0/set_01/hanoi_15x15_100_set_01_p0"
          actual="$root/$HANOI_SOURCE_ROOT/set_01/weekday/hanoi_15x15_100_set_01_weekday"
          work="$(mktemp -d)"
          cd "$work"
          "$root/build/hanoi_case_solver/tabubu_HanoiTraffic_v2" "$p0.txt" \
            --truck-distance-file="$p0.truck_distance_m.txt" \
            --drone-distance-file="$p0.drone_distance_m.txt" \
            --truck-vijl-file="$p0.v_ijl_kph.txt" \
            --start-hour=6 --attempts=1 --iters=2 --segment-iters=1 --time-limit=60 --seed=1
          test -s output_solution_best.txt
          mkdir replay
          cd replay
          set +e
          "$root/build/hanoi_case_solver/tabubu_HanoiTraffic_v2" "$actual.txt" \
            --truck-distance-file="$actual.truck_distance_m.txt" \
            --drone-distance-file="$actual.drone_distance_m.txt" \
            --truck-vijl-file="$actual.v_ijl_kph.txt" \
            --start-hour=8 --evaluate-solution="$work/output_solution_best.txt"
          status=$?
          set -e
          [[ "$status" == 0 || "$status" == 2 ]]
          test -s output_solution_evaluated.txt

      - name: Upload solver and generated profiles
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-case-p0-p1-support
          path: |
            build/hanoi_case_solver/tabubu_HanoiTraffic_v2
            build/hanoi_case_policies/
          if-no-files-found: error
          retention-days: 2

  solve:
    name: ${{ matrix.batch_id }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: hanoi-case-p0-p1-support
          path: build/support

      - name: Run optimization and realized-traffic replay
        env:
          TASKS_JSON: ${{ matrix.tasks_json }}
        shell: bash
        run: |
          set -euo pipefail
          binary="build/support/hanoi_case_solver/tabubu_HanoiTraffic_v2"
          chmod +x "$binary"
          python3 scripts/hanoi_case_study_cloud.py run-policy \
            --binary "$binary" \
            --source-root "$HANOI_SOURCE_ROOT" \
            --policy-root build/support/hanoi_case_policies \
            --tasks-json "$TASKS_JSON" \
            --output result

      - name: Upload batch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-case-p0-p1-${{ matrix.batch_id }}
          path: result/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate P0/P1 results
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Excel dependency
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - uses: actions/download-artifact@v4
        with:
          pattern: hanoi-case-p0-p1-policy-batch*
          path: collected_results

      - name: Build consolidated workbook
        run: |
          python3 scripts/hanoi_case_study_cloud.py aggregate \
            --experiment policy \
            --input-root collected_results \
            --output hanoi_case_p0_p1/hanoi_case_p0_p1_results.xlsx

      - name: Upload consolidated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-case-p0-p1-results
          path: hanoi_case_p0_p1/
          if-no-files-found: warn
          retention-days: 90
