name: Compare Light vs Heavy Traffic – Drone Role (multi-trip, Dh=200, Dd=2.27, 5 runs × 16 instances = 160 jobs)

# So sánh vai trò của drone khi đường phố:
#   Case "light" : sigma xoay vòng {0.9, 0.7, 0.8} → tắc ít, truck nhanh hơn
#   Case "heavy" : sigma xoay vòng {0.6, 0.4, 0.5} → tắc nhiều, truck chậm hơn
# Cả 2 case đều dùng truck multiple-trip, Dh=200 kg, Dd=2.27 kg.

on:
  push:
    branches:
      - main_huett
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Tạo ma trận: 16 instances × 2 traffic cases × 5 runs = 160 jobs
  # ──────────────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare run matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate 160-item matrix (instances × traffic_case × runs)
        id: set-matrix
        run: |
          python3 - <<'PYEOF'
          import json, os, glob

          # sigma xoay vòng 12 segment (chu kỳ 3)
          LIGHT = [round(v, 1) for i in range(12) for v in [[0.9, 0.7, 0.8][i % 3]]]
          HEAVY = [round(v, 1) for i in range(12) for v in [[0.6, 0.4, 0.5][i % 3]]]

          items = []
          for f in sorted(glob.glob('big_instance/*.txt')):
              base = os.path.basename(f)[:-4]
              for traffic, sigma in [('light', LIGHT), ('heavy', HEAVY)]:
                  for run in range(1, 6):
                      items.append({
                          'file':    f,
                          'base':    base,
                          'traffic': traffic,
                          'sigma':   sigma,   # list of 12 floats
                          'run':     run,
                      })

          print(f'Matrix: {len(items)} jobs total', flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'matrix={json.dumps(items)}\n')
          PYEOF

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Biên dịch 2 binary: tabubu_light và tabubu_heavy
  #    Patch: Dh=200, Dd=2.27 giữ nguyên, sigma thay theo từng case
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build light & heavy traffic binaries (Dh=200, Dd=2.27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Patch sigma & Dh, compile 2 binaries
        run: |
          python3 - <<'PYEOF'
          import re

          LIGHT = [0.9, 0.7, 0.8] * 4   # 12 segments
          HEAVY = [0.6, 0.4, 0.5] * 4

          with open('tabubu.cpp') as f:
              src = f.read()

          # 1. Patch Dh=200
          src = re.sub(r'double Dh\s*=\s*[\d.]+;', 'double Dh = 200.0;', src)

          # 2. Patch sigma – thay dòng time_segments_sigma (active, không phải comment)
          sigma_pattern = re.compile(
              r'^(vd time_segments_sigma\s*=\s*\{)[^}]*(}\s*;.*)',
              re.MULTILINE
          )

          def make_sigma_line(prefix, suffix, values):
              vals = ', '.join(str(v) for v in values)
              return f'{prefix}{vals}{suffix}'

          for traffic, sigma_vals in [('light', LIGHT), ('heavy', HEAVY)]:
              m = sigma_pattern.search(src)
              if not m:
                  raise RuntimeError('Cannot find time_segments_sigma line')
              patched = sigma_pattern.sub(
                  lambda mo, sv=sigma_vals: make_sigma_line(mo.group(1), mo.group(2), sv),
                  src
              )
              out_file = f'tabubu_{traffic}_patched.cpp'
              with open(out_file, 'w') as f:
                  f.write(patched)
              print(f'[{traffic}] sigma patched: {sigma_vals}')

          PYEOF

          echo "=== Verify Dh & sigma (light) ==="
          grep 'double Dh\|time_segments_sigma' tabubu_light_patched.cpp | grep -v '^\s*//'

          echo "=== Verify Dh & sigma (heavy) ==="
          grep 'double Dh\|time_segments_sigma' tabubu_heavy_patched.cpp | grep -v '^\s*//'

          g++ -O2 -std=c++17 tabubu_light_patched.cpp -o tabubu_light
          g++ -O2 -std=c++17 tabubu_heavy_patched.cpp -o tabubu_heavy
          echo "Build OK: tabubu_light, tabubu_heavy"

      - name: Upload solver binaries
        uses: actions/upload-artifact@v4
        with:
          name: solver-bins
          path: |
            tabubu_light
            tabubu_heavy
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Mỗi job = 1 instance × 1 traffic case × 1 run (timeout 2h)
  # ──────────────────────────────────────────────────────────────────────────
  run:
    name: "${{ matrix.base }} | ${{ matrix.traffic }} | run ${{ matrix.run }}"
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 20
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v5

      - name: Download solver binaries
        uses: actions/download-artifact@v4
        with:
          name: solver-bins

      - name: Make executables
        run: chmod +x tabubu_light tabubu_heavy

      - name: Run solver (${{ matrix.traffic }} traffic)
        run: |
          binary="./tabubu_${{ matrix.traffic }}"
          echo "=== Running: $binary ${{ matrix.file }} --attempts=1 --time-limit=7200 ==="
          $binary "${{ matrix.file }}" --attempts=1 --time-limit=7200 2>&1 || true

          {
            echo "INSTANCE_FILE: ${{ matrix.file }}"
            echo "INSTANCE_BASE: ${{ matrix.base }}"
            echo "SOLVER: ${{ matrix.traffic }}"
            echo "TRAFFIC: ${{ matrix.traffic }}"
            echo "SIGMA: ${{ join(matrix.sigma, ',') }}"
            echo "RUN: ${{ matrix.run }}"
            echo "---SOLVER OUTPUT---"
            if [ -f output_solution_best.txt ]; then
              cat output_solution_best.txt
              rm -f output_solution_best.txt
            else
              echo "Final solution feasibility: INFEASIBLE"
              echo "Improved solution cost: "
              echo "Mean solution cost: "
              echo "Worst solution cost: "
              echo "Mean elapsed time: "
            fi
          } > result_${{ matrix.traffic }}_run${{ matrix.run }}.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "result-${{ matrix.base }}-${{ matrix.traffic }}-run${{ matrix.run }}"
          path: "result_${{ matrix.traffic }}_run${{ matrix.run }}.txt"
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Thu thập & phân tích: drone thể hiện vai trò như thế nào?
  # ──────────────────────────────────────────────────────────────────────────
  collect:
    name: Collect results and analyse drone role
    needs: run
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Download all run artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Flatten result files into results/
        run: |
          mkdir -p results
          find all_artifacts -name 'result_*.txt' | while read src; do
            artifact_name=$(basename "$(dirname "$src")")
            cp "$src" "results/${artifact_name}.txt"
          done
          echo "=== $(ls results/ | wc -l) result files collected ==="
          ls results/ | sort | head -30

      - name: Parse results & analyse drone role (light vs heavy traffic)
        run: |
          python3 - <<'PYEOF'
          import os, re, glob, csv
          from collections import defaultdict
          import math

          # ── Parse 1 file kết quả ─────────────────────────────────────────
          def parse_file(path):
              meta = {}
              solver_lines = []
              in_solver = False
              with open(path, encoding='utf-8', errors='replace') as f:
                  for line in f:
                      line = line.rstrip('\n')
                      if line == '---SOLVER OUTPUT---':
                          in_solver = True
                          continue
                      if not in_solver:
                          m = re.match(r'^(\w+):\s*(.+)$', line)
                          if m:
                              meta[m.group(1)] = m.group(2).strip()
                      else:
                          solver_lines.append(line)
              content = '\n'.join(solver_lines)

              def find(pattern, default=''):
                  m = re.search(pattern, content)
                  return m.group(1).strip() if m else default

              feas_m = re.search(r'Final solution feasibility:\s*(\w+)', content)
              feas   = 'yes' if feas_m and feas_m.group(1) == 'FEASIBLE' else 'no'

              final_cost = find(r'Improved solution cost:\s*([\d.]+)')
              elapsed    = find(r'Mean elapsed time:\s*([\d.]+)')

              # Truck routes & times
              truck_times = [float(m.group(2))
                             for m in re.finditer(
                                 r'Truck \d+:\s*[\d ]+\|Truck Time:\s*([\d.]+)', content)]
              # Drone routes & times
              drone_routes = []
              drone_times  = []
              for m in re.finditer(
                      r'Drone \d+:\s*([\d ]+)\|Drone Time:\s*([\d.]+)', content):
                  route = [int(x) for x in m.group(1).strip().split()]
                  drone_routes.append(route)
                  drone_times.append(float(m.group(2)))

              # Số khách được drone phục vụ (node != 0, != depot)
              drone_customers = sum(
                  len([n for n in r if n != 0]) for r in drone_routes
              )

              return {
                  'base':            meta.get('INSTANCE_BASE', ''),
                  'traffic':         meta.get('TRAFFIC', meta.get('SOLVER', '')),
                  'run':             meta.get('RUN', ''),
                  'feasibility':     feas,
                  'final_cost':      float(final_cost) if final_cost else None,
                  'elapsed':         float(elapsed) if elapsed else None,
                  'truck_times':     truck_times,
                  'drone_times':     drone_times,
                  'drone_customers': drone_customers,
              }

          # ── Đọc tất cả files ─────────────────────────────────────────────
          records = []
          for fpath in sorted(glob.glob('results/*.txt')):
              try:
                  records.append(parse_file(fpath))
              except Exception as e:
                  print(f'  Warning: skip {fpath}: {e}')

          # ── Gộp theo (instance, traffic) → thống kê qua 5 runs ──────────
          # data[base][traffic] = list of records
          data = defaultdict(lambda: defaultdict(list))
          for r in records:
              if r['base'] and r['traffic']:
                  data[r['base']][r['traffic']].append(r)

          # ── Ghi CSV chi tiết ─────────────────────────────────────────────
          csv_rows = []
          for base in sorted(data.keys()):
              for traffic in ('light', 'heavy'):
                  for r in data[base][traffic]:
                      max_truck = max(r['truck_times']) if r['truck_times'] else None
                      max_drone = max(r['drone_times']) if r['drone_times'] else None
                      csv_rows.append({
                          'instance':        base,
                          'traffic':         traffic,
                          'run':             r['run'],
                          'feasibility':     r['feasibility'],
                          'final_cost':      r['final_cost'] if r['final_cost'] else '',
                          'elapsed_s':       r['elapsed'] if r['elapsed'] else '',
                          'max_truck_time':  f'{max_truck:.2f}' if max_truck else '',
                          'max_drone_time':  f'{max_drone:.2f}' if max_drone else '',
                          'drone_customers': r['drone_customers'],
                      })

          with open('results_detail.csv', 'w', newline='') as f:
              w = csv.DictWriter(f, fieldnames=[
                  'instance', 'traffic', 'run', 'feasibility',
                  'final_cost', 'elapsed_s',
                  'max_truck_time', 'max_drone_time', 'drone_customers',
              ])
              w.writeheader()
              w.writerows(csv_rows)
          print('Saved: results_detail.csv')

          # ── In bảng so sánh tổng hợp ─────────────────────────────────────
          HEADER = (
              f"{'Instance':<15} "
              f"{'Light feas':>10} {'Heavy feas':>10}  "
              f"{'Light best':>12} {'Heavy best':>12}  "
              f"{'Cost Δ%':>8}  "
              f"{'L drone cust':>13} {'H drone cust':>13}  "
              f"{'ΔDrone cust':>11}  "
              f"{'L drone/truck':>13} {'H drone/truck':>13}"
          )
          SEP = '─' * len(HEADER)

          summary_rows = []
          print()
          print(SEP)
          print('  DRONE ROLE: Light traffic (σ∈{0.9,0.7,0.8})  vs  Heavy traffic (σ∈{0.6,0.4,0.5})')
          print('  Truck multiple-trip | Dh=200 kg | Dd=2.27 kg | 5 runs per instance')
          print(SEP)
          print(HEADER)
          print(SEP)

          for base in sorted(data.keys()):
              L = data[base].get('light', [])
              H = data[base].get('heavy', [])

              l_feas = sum(1 for r in L if r['feasibility'] == 'yes')
              h_feas = sum(1 for r in H if r['feasibility'] == 'yes')
              l_costs = [r['final_cost'] for r in L if r['final_cost'] is not None]
              h_costs = [r['final_cost'] for r in H if r['final_cost'] is not None]
              l_best = min(l_costs) if l_costs else None
              h_best = min(h_costs) if h_costs else None

              # Drone customers (trung bình qua các run feasible)
              l_dc = [r['drone_customers'] for r in L if r['feasibility'] == 'yes']
              h_dc = [r['drone_customers'] for r in H if r['feasibility'] == 'yes']
              l_dc_avg = sum(l_dc) / len(l_dc) if l_dc else None
              h_dc_avg = sum(h_dc) / len(h_dc) if h_dc else None

              # Drone/Truck time ratio (makespan drone vs makespan truck)
              def avg_ratio(recs):
                  ratios = []
                  for r in recs:
                      if r['feasibility'] == 'yes' and r['truck_times'] and r['drone_times']:
                          mt = max(r['truck_times'])
                          md = max(r['drone_times'])
                          if mt > 0:
                              ratios.append(md / mt)
                  return sum(ratios) / len(ratios) if ratios else None

              l_ratio = avg_ratio(L)
              h_ratio = avg_ratio(H)

              # Format
              l_feas_s  = f"{l_feas}/{len(L)}"
              h_feas_s  = f"{h_feas}/{len(H)}"
              l_best_s  = f"{l_best:.2f}" if l_best else 'INFEAS'
              h_best_s  = f"{h_best:.2f}" if h_best else 'INFEAS'

              if l_best and h_best:
                  delta_pct = (h_best - l_best) / l_best * 100.0
                  delta_s   = f"{delta_pct:+.2f}%"
              else:
                  delta_s   = 'N/A'

              l_dc_s  = f"{l_dc_avg:.1f}" if l_dc_avg is not None else 'N/A'
              h_dc_s  = f"{h_dc_avg:.1f}" if h_dc_avg is not None else 'N/A'
              if l_dc_avg is not None and h_dc_avg is not None:
                  delta_dc_s = f"{h_dc_avg - l_dc_avg:+.1f}"
              else:
                  delta_dc_s = 'N/A'

              l_ratio_s = f"{l_ratio:.3f}" if l_ratio is not None else 'N/A'
              h_ratio_s = f"{h_ratio:.3f}" if h_ratio is not None else 'N/A'

              print(
                  f"{base:<15} "
                  f"{l_feas_s:>10} {h_feas_s:>10}  "
                  f"{l_best_s:>12} {h_best_s:>12}  "
                  f"{delta_s:>8}  "
                  f"{l_dc_s:>13} {h_dc_s:>13}  "
                  f"{delta_dc_s:>11}  "
                  f"{l_ratio_s:>13} {h_ratio_s:>13}"
              )

              summary_rows.append({
                  'instance':          base,
                  'light_feasible':    l_feas,
                  'light_total':       len(L),
                  'heavy_feasible':    h_feas,
                  'heavy_total':       len(H),
                  'light_best_cost':   l_best_s,
                  'heavy_best_cost':   h_best_s,
                  'cost_delta_pct':    delta_s,
                  'light_avg_drone_customers': l_dc_s,
                  'heavy_avg_drone_customers': h_dc_s,
                  'delta_drone_customers':     delta_dc_s,
                  'light_avg_drone_truck_ratio': l_ratio_s,
                  'heavy_avg_drone_truck_ratio': h_ratio_s,
              })

          print(SEP)

          # Tổng kết
          lf = sum(r['light_feasible'] for r in summary_rows)
          lt = sum(r['light_total']    for r in summary_rows)
          hf = sum(r['heavy_feasible'] for r in summary_rows)
          ht = sum(r['heavy_total']    for r in summary_rows)
          print(f"\n  Feasibility: light={lf}/{lt} ({100*lf/lt:.1f}%)  "
                f"heavy={hf}/{ht} ({100*hf/ht:.1f}%)")

          # Trường hợp heavy có drone tốt hơn?
          better_drone_in_heavy = sum(
              1 for r in summary_rows
              if r['delta_drone_customers'] not in ('N/A',) and
                 float(r['delta_drone_customers']) > 0
          )
          print(f"  Instances where drone serves MORE customers in heavy traffic: "
                f"{better_drone_in_heavy}/{len(summary_rows)}")

          higher_cost_heavy = sum(
              1 for r in summary_rows
              if r['cost_delta_pct'] not in ('N/A',) and
                 float(r['cost_delta_pct'].replace('%','')) > 0
          )
          print(f"  Instances where heavy traffic → higher cost: "
                f"{higher_cost_heavy}/{len(summary_rows)}")
          print(SEP + '\n')

          # Ghi CSV tổng hợp
          with open('comparison_summary.csv', 'w', newline='') as f:
              w = csv.DictWriter(f, fieldnames=[
                  'instance',
                  'light_feasible', 'light_total',
                  'heavy_feasible', 'heavy_total',
                  'light_best_cost', 'heavy_best_cost', 'cost_delta_pct',
                  'light_avg_drone_customers', 'heavy_avg_drone_customers',
                  'delta_drone_customers',
                  'light_avg_drone_truck_ratio', 'heavy_avg_drone_truck_ratio',
              ])
              w.writeheader()
              w.writerows(summary_rows)
          print('Saved: comparison_summary.csv')
          PYEOF

      - name: Upload CSV reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-comparison-csv
          path: |
            results_detail.csv
            comparison_summary.csv
          if-no-files-found: warn
